{% extends "base.html" %}
{% block title %}Recipes - Log in{% endblock %}
{% block description %}A private recipe tool.{% endblock %}
{% block head %}<meta name="robots" content="noindex, nofollow">{% endblock %}
{% block content %}
<main class="container mx-auto px-6 py-12 max-w-md">
    <div class="bg-white rounded-lg shadow-md p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-4">Recipes</h1>
        {% if error %}<p class="text-red-600 mb-4" role="alert">{{ error }}</p>{% endif %}
        <form method="post" action="/recipes/login">
            <label for="password" class="block text-gray-700 mb-2">Password</label>
            <input id="password" name="password" type="password" required autofocus autocomplete="current-password"
                class="w-full border border-gray-300 rounded-lg p-2 mb-4">
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Log in</button>
        </form>
    </div>
</main>
{% endblock %}
