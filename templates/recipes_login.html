{% extends "base.html" %}
{% block title %}Recipes - Log in{% endblock %}
{% block description %}A private recipe tool.{% endblock %}
{% block head %}<meta name="robots" content="noindex, nofollow">{% endblock %}
{% block content %}
<main class="page wrap wrap-login">
    <h1 class="title mb-6">Recipes</h1>
    {% if error %}<p class="notice mb-4" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/recipes/login" data-busy="Logging in...">
        <label for="password" class="field-label">Password</label>
        <input id="password" name="password" type="password" required autofocus autocomplete="current-password" class="input mb-4">
        <button type="submit" class="btn btn-primary w-full">Log in</button>
    </form>
</main>
{% endblock %}
