<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <meta name="description" content="{% block description %}Prashand Ramesar: AI product and delivery lead, and senior data scientist.{% endblock %}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ self.title() }}">
    <meta property="og:description" content="{{ self.description() }}">
    <meta property="og:image" content="{{ site_url }}/static/img/og.png">
    <meta name="twitter:card" content="summary_large_image">
    {% if canonical_url %}
    <link rel="canonical" href="{{ canonical_url }}">
    <meta property="og:url" content="{{ canonical_url }}">
    {% endif %}
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfcfd">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1116">
    <!-- Runs before the first paint, so a saved theme never flashes the other one. -->
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('theme');
                if (theme === 'light' || theme === 'dark') {
                    document.documentElement.setAttribute('data-theme', theme);
                }
            } catch (e) {
                // Blocked storage falls back to the system setting.
            }
        })();
    </script>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/css/site.css">
    {% block head %}{% endblock %}
</head>
<body>
    {% include 'navbar.html' %}

    {% block content %}{% endblock %}

    <footer class="site-footer">
        <div class="wrap">
            <p>© {{ current_year }} Prashand Ramesar - All Rights Reserved</p>
        </div>
    </footer>
    <script src="/static/js/site.js" defer></script>
    {% block scripts %}{% endblock %}
</body>
</html>
